<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2647d6"/>
      <stop offset="0.55" stop-color="#3c67ff"/>
      <stop offset="1" stop-color="#6d8dff"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
      .muted { fill-opacity: 0.72; }
      .card { fill: #ffffff; fill-opacity: 0.12; stroke: #ffffff; stroke-opacity: 0.22; }
    </style>
  </defs>

  <rect width="960" height="1080" fill="url(#bg)"/>
  <rect width="960" height="1080" fill="url(#grid)"/>

  <!-- Знак и название -->
  <g transform="translate(120 132) scale(2)">
    <rect width="32" height="32" rx="9" fill="#ffffff"/>
    <path d="M9 11h14M9 16h14M9 21h7" stroke="#3c67ff" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="21.5" cy="21" r="2.2" fill="#a9bcff"/>
  </g>
  <text x="204" y="178" font-size="40" font-weight="700">Ledgerline</text>

  <!-- Заголовок -->
  <text x="120" y="310" font-size="48" font-weight="700">
    <tspan x="120">Отчётные периоды,</tspan>
    <tspan x="120" dy="60">транзакции</tspan>
    <tspan x="120" dy="60">и аналитика —</tspan>
    <tspan x="120" dy="60">в одном окне</tspan>
  </text>
  <text x="120" y="560" font-size="22" class="muted">Демо-проект на вымышленных данных</text>

  <!-- Карточка счёта -->
  <rect x="120" y="620" width="340" height="190" rx="22" class="card"/>
  <text x="152" y="668" font-size="20" font-weight="700">Расчётный счёт</text>
  <text x="152" y="712" font-size="15" class="muted">Начало дня</text>
  <text x="152" y="744" font-size="26" font-weight="700">1 737 000,00 ₽</text>
  <text x="152" y="780" font-size="15" class="muted">Конец дня: 1 572 100,00 ₽</text>

  <!-- Карточка план / факт -->
  <rect x="500" y="620" width="340" height="300" rx="22" class="card"/>
  <text x="532" y="668" font-size="20" font-weight="700">План / факт</text>
  <g transform="translate(540 870)">
    <rect x="0" y="-150" width="22" height="150" rx="6" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="26" y="-128" width="22" height="128" rx="6" fill="#ffffff"/>
    <rect x="72" y="-110" width="22" height="110" rx="6" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="98" y="-112" width="22" height="112" rx="6" fill="#ffffff"/>
    <rect x="144" y="-170" width="22" height="170" rx="6" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="170" y="-140" width="22" height="140" rx="6" fill="#ffffff"/>
    <rect x="216" y="-90" width="22" height="90" rx="6" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="242" y="-64" width="22" height="64" rx="6" fill="#ffffff"/>
  </g>
  <rect x="540" y="890" width="12" height="12" rx="3" fill="#ffffff" fill-opacity="0.35"/>
  <text x="560" y="901" font-size="14" class="muted">План</text>
  <rect x="616" y="890" width="12" height="12" rx="3" fill="#ffffff"/>
  <text x="636" y="901" font-size="14" class="muted">Факт</text>

  <!-- Статусы операций -->
  <rect x="120" y="850" width="170" height="44" rx="22" fill="#ffffff"/>
  <text x="205" y="878" font-size="16" font-weight="700" text-anchor="middle" style="fill: #2e9e5b">Завершено ✓</text>
  <rect x="120" y="910" width="210" height="44" rx="22" class="card"/>
  <text x="225" y="938" font-size="16" text-anchor="middle">На согласовании</text>
</svg>
